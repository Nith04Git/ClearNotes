<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearNotes</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Favicon -->
  <link rel="icon" href="ClearNotesMiniLogo.png">

  <style>
    :root {
      --bg-main: #fcf2bd;
      --bg-card: #ffffff;
      --accent: #f76307;
      --accent-soft: #fffcab;
      --text-main: #1e1e1e;
      --text-muted: #666;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
    }

    body {
      margin: 10px;
      background: linear-gradient(to bottom, #ffffff, var(--bg-main));
      color: var(--text-main);
    }

    /* ---------- SECTIONS ---------- */
    section {
      padding: 50px 20px;
      max-width: 1100px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    /* ---------- CARD GRID ---------- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: var(--text-muted);
    }

    .btn {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-secondary {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

iframe {
   border-radius: var(--radius);
}
  </style>
</head>

<body>
  <h1>Mathematics</h1>

  <hr style="border: none; height: 5px; background-color: #333;">

  <h2>General</h2>

  <br>
  <h3 id="formulaText"><u>Lexicon of Formulae</u></h3>

  <iframe id="formulaFrame" src="mathematics_lexiconofforumulae.pdf" width="100%" height="700px" style="border: none;">
    <p>Your browser does not support embedded files.
    <a href="mathematics_lexiconofforumulae.pdf">Download the file</a> instead.</p>
  </iframe>

  <script>
    window.addEventListener("load", () => {
      let currentGrade = localStorage.getItem("chosenGrade") 
        ? localStorage.getItem("chosenGrade").trim() 
        : null;

      let frame = document.getElementById("formulaFrame");
      let text = document.getElementById("formulaText");

      if (currentGrade) {
        if (parseInt(currentGrade) > 6) {
          frame.style.display = "block";
          text.style.display = "block";
        } else {
          frame.style.display = "none";
          text.style.display = "none";
        }
      }
    });
  </script>
</body>
</html>
