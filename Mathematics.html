<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearNotes</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Favicon -->
  <link rel="icon" href="ClearNotesMiniLogo.png">

  <style>
    :root {
      --bg-main: #fcf2bd;
      --bg-card: #ffffff;
      --accent: #f76307;
      --accent-soft: #fffcab;
      --text-main: #1e1e1e;
      --text-muted: #666;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
    }

    body {
      margin: 10px;
      background: linear-gradient(to bottom, #ffffff, var(--bg-main));
      color: var(--text-main);
    }

    /* ---------- SECTIONS ---------- */
    section {
      padding: 50px 20px;
      max-width: 1100px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    /* ---------- CARD GRID ---------- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: var(--text-muted);
    }

    .btn {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-secondary {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

iframe {
   border-radius: var(--radius);
}
  </style>
</head>

<body>
  <h1>Mathematics</h1>

  <hr style="border: none; height: 5px; background-color: #333;">

  <h2>General</h2>

  <br>
  <h3 id="formulaText"><u>Lexicon of Formulae</u></h3>

  <iframe id="formulaFrame" src="mathematics_lexiconofforumulae.pdf" width="100%" height="700px" style="border: none;">
    <p>Your browser does not support embedded files.
    <a href="mathematics_lexiconofforumulae.pdf">Download the file</a> instead.</p>
  </iframe>

  <hr style="border: none; height: 5px; background-color: #333;">
<h3>Your syllabus for Mathematics for this year</h3>

<div class="card-grid" id="syllabus-grid">
<p id="loading-status">Loading syllabus...</p>
</div>

  <script>
    window.addEventListener("load", () => {
      let currentGrade = localStorage.getItem("chosenGrade") 
        ? localStorage.getItem("chosenGrade").trim() 
        : null;

      let frame = document.getElementById("formulaFrame");
      let text = document.getElementById("formulaText");

      if (currentGrade) {
        if (parseInt(currentGrade) > 6) {
          frame.style.display = "block";
          text.style.display = "block";
        } else {
          frame.style.display = "none";
          text.style.display = "none";
        }
      }
    });
  </script>
<script>
const school = JSON.parse(localStorage.getItem("chosenSchool"));
    const grade = localStorage.getItem("chosenGrade") ? localStorage.getItem("chosenGrade").trim() : null;
    const section = localStorage.getItem("chosenSection");

    document.getElementById("school-name").textContent = school ? school.name : "Not selected";
    document.getElementById("grade-display").textContent = grade ? grade : "Not selected";
    document.getElementById("section-display").textContent = section ? " " + section : "";

    const gridContainer = document.getElementById("syllabus-grid");
    const statusText = document.getElementById("loading-status");

    // Converts grade numbers ('9') to chronological lower-case alphabets ('i')
    function deriveGradeCharacter(gradeString) {
      const gradeInt = parseInt(gradeString, 10);
      if (isNaN(gradeInt) || gradeInt < 1 || gradeInt > 26) return "";
      return String.fromCharCode(96 + gradeInt); 
    }

    function injectExcelEngine(callback) {
      const script = document.createElement("script");

      script.src = "https://" + "cdn.jsdelivr.net/npm/" + "xlsx@0.18.5/dist/xlsx.full.min.js";
      script.onload = callback;
      script.onerror = () => {
        statusText.innerHTML = `<span style="color: red; font-weight: 600;">Failed to load Database parsing library. Please check your internet connection.</span>`;
      };
      document.head.appendChild(script);
    }

    async function loadSyllabusFromExcel() {
      if (!grade) {
        statusText.textContent = "Please select a grade to look up your syllabus.";
        return;
      }

      const paths = ["./BookDatabase.xlsx", "BookDatabase.xlsx", "./BookDatabase.xslx"];
      let response = null;

      for (const p of paths) {
        try {
          const res = await fetch(p);
          if (res.ok) {
            response = res;
            break;
          }
        } catch (e) {
          console.error("Path unavailable: " + p);
        }
      }

      if (!response) {
        statusText.innerHTML = `<span style="color: red; font-weight: 600;">Error: Could not locate database.</span>`;
        return;
      }

      try {
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        
        const workbook = window.XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const parsedRows = window.XLSX.utils.sheet_to_json(worksheet);
        
        const matchingBooks = parsedRows.filter(row => {
          if (!row.Class) return false;
          return String(row.Class).trim() === grade;
        });

        gridContainer.innerHTML = "";

        if (matchingBooks.length === 0) {
          gridContainer.innerHTML = `<p>No textbooks listed in database matching Grade ${grade}.</p>`;
          return;
        }

        const gradeLetter = deriveGradeCharacter(grade);

        // Read all saved examination schedules so textbook cards can show
        // upcoming exams, even when a different examination is selected below.
        function getUpcomingExamMatches(textbookSubject) {
          try {
            const stored = JSON.parse(localStorage.getItem("clearNotesExamSchedule") || "[]");
            const allSchedules = Array.isArray(stored)
              ? stored
              : (stored && typeof stored.name === "string" && Array.isArray(stored.entries) ? [stored] : []);
            const normalize = value => String(value || "").trim().toLocaleLowerCase();
            const textbookName = normalize(textbookSubject);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const soonLimit = new Date(today);
            soonLimit.setDate(soonLimit.getDate() + 30);
            const todayISO = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
            const limitISO = `${soonLimit.getFullYear()}-${String(soonLimit.getMonth()+1).padStart(2,"0")}-${String(soonLimit.getDate()).padStart(2,"0")}`;

            return allSchedules.flatMap(exam => {
              if (!exam || !Array.isArray(exam.entries)) return [];
              return exam.entries
                .filter(entry => {
                  const examSubject = normalize(entry.subject);
                  return examSubject && textbookName.includes(examSubject) &&
                    /^\d{4}-\d{2}-\d{2}$/.test(entry.date) &&
                    entry.date >= todayISO && entry.date <= limitISO;
                })
                .map(entry => ({
                  examination: entry.examination || exam.name || "Scheduled examination",
                  date: entry.date
                }));
            }).sort((a, b) => a.date.localeCompare(b.date));
          } catch (error) {
            console.warn("Could not read exam schedule for textbook reminders:", error);
            return [];
          }
        }

matchingBooks.forEach(book => {
  const subject = book["Subject"] || "Unknown Subject";

  // Only continue if subject includes "Mathematics"
  if (!subject.toLowerCase().includes("mathematics")) {
    return; // skip this book
  }

  const card = document.createElement("div");
  card.className = "card";

  const chapters = book["Number of Chapters"] || "0";
  const code = String(book["Code"] || "").trim().toLowerCase();
  const importance = String(book["Importance"] || "Secondary").trim();

  let badgeColor = "#fc9d21";
  if (importance.toLowerCase() === "primary") badgeColor = "#fc2c03";
  if (importance.toLowerCase() === "language") badgeColor = "#00abfa";

  const gradeLetter = deriveGradeCharacter(grade);
  const coverUrl = `https://ncert.nic.in/textbook/pdf/${gradeLetter}${code}cc.jpg`;
  const textBookUrl = `https://ncert.nic.in/textbook.php?${gradeLetter}${code}=0-${chapters}`;

  card.innerHTML = `
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px;">
      <h3 style="margin: 0;">${subject}</h3>
      <span style="background: ${badgeColor}; color: white; padding: 4px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; white-space: nowrap; letter-spacing: 0.5px;">
        ${importance}
      </span>
    </div>
    <p><b>NCERT Textbook</b> for Class ${grade}</p>
    <p><small style="color: var(--accent); font-weight: 600;">Chapters: ${chapters} | Catalog Code: ${code}</small></p>
    ...
  `;

  // rest of your card logic (exam reminders, buttons, etc.)
  gridContainer.appendChild(card);
});

      } catch (err) {
        console.error(err);
        statusText.innerHTML = `<span style="color: red; font-weight: 600;">Parsing Failure: ${err.message}</span>`;
      }
    }

    injectExcelEngine(loadSyllabusFromExcel);
</script>
</body>
</html>
