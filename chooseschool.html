<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearNotes</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" href="ClearNotesMiniLogo.png">

  <style>
    :root {
      --bg-main: #fcf2bd;
      --bg-card: #ffffff;
      --accent: #f76307;
      --accent-soft: #fffcab;
      --text-main: #1e1e1e;
      --text-muted: #666;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
    }

    body {
      margin: 10;
      background: linear-gradient(to bottom, #ffffff, var(--bg-main));
      color: var(--text-main);
    }

    /* ---------- HEADER / HERO ---------- */
    header {
      padding: 60px 20px 40px;
      text-align: center;
      background: linear-gradient(135deg, #eef4ff, #ffffff);
    }

    header h1 {
      font-size: 3rem;
      margin: 0;
    }

    header p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 20px auto;
    }

    .cta-row {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-secondary {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

    /* ---------- SECTIONS ---------- */
    section {
      padding: 50px 20px;
      max-width: 1100px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    section p.section-desc {
      text-align: center;
      color: var(--text-muted);
      max-width: 700px;
      margin: auto auto 40px;
    }

    /* ---------- CARD GRID ---------- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: var(--text-muted);
    }

    .card img {
      border-radius: var(--radius);
    }
 	

    /* ---------- VIDEO ---------- */
    .video-wrapper {
      max-width: 720px;
      margin: auto;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    video {
      width: 100%;
      display: block;
    }

    /* ---------- QUOTES ---------- */
    .quote {
      background: linear-gradient(135deg, #f0f6ff, #ffffff);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
    }

    .quote i {
      color: var(--text-muted);
    }

    select {
      background: var(--accent-soft);
      color: black;
      box-shadow: var(--shadow);
      appearance: none;
      -webkit-appearance: none;
      padding: 10px;
      border: 1px solid #000000;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    select:hover {
      transform: translateY(-2px);
    }

    option {
      background: white;
      color: var(--accent);
      appearance: none;
      border-radius: 10px;
      cursor: pointer;
    }
      

    /* ---------- FOOTER ---------- */
    footer {
      text-align: center;
      padding: 40px 20px;
      background: #f0f2f6;
      color: var(--text-muted);
    }
  </style>
<title>ClearNotes - Signup</title>
</head>

<body>
<h1>Step 1 complete.</h1>
<hr>

<h2>You've chosen <b><u><span id="chosen-school"></span></u></b> 
<img src="https://cdn-icons-png.flaticon.com/32/167/167707.png" alt="img"> .</h2>
<p id="school-address"></p>

<hr>

<a id="google-search-link" href="#" target="_blank">
  <button class="btn btn-primary">Search this school on <br><br>	
  <img src="Google-Logo.jpg" alt="logo" width="200" style="border-radius: var(--radius);"></button>
</a>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import firebaseConfig from "./firebaseConfig.js";

  console.log("Imports succeeded");

  let db;
  try {
    const app = initializeApp(firebaseConfig);
    console.log("Firebase initialized");
    db = getFirestore(app);
    console.log("Firestore ready");
  } catch (err) {
    console.error("Firebase init failed:", err);
  }

  const gradePicker = document.getElementById("grade-picker");
  const saveButton = document.getElementById("save-grade");

  console.log("Attaching listener:", saveButton);

  saveButton.addEventListener("click", async () => {
    console.log("Button clicked!");

    const grade = gradePicker.value;
    if (!grade) {
      alert("Please select a grade first!");
      return;
    }

    localStorage.setItem("chosenGrade", grade);

    const school = JSON.parse(localStorage.getItem("chosenSchool"));
    const userId = "demoUser";

    try {
      await setDoc(doc(db, "users", userId), {
        school: school?.name || "Unknown",
        address: school?.address || "Unknown",
        grade: grade,
        chosenAt: new Date().toISOString()
      });
      console.log("School + grade saved to Firestore");
    } catch (err) {
      console.error("Error saving:", err);
    }

    window.location.href = "choosesection.html";
  });
</script>
</body>
</html>
