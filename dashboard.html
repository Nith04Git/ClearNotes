<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearNotes</title>

  <!-- Fonts -->
  <link href="https://googleapis.com" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" href="ClearNotesMiniLogo.png">

  <style>
    :root {
      --bg-main: #fcf2bd;
      --bg-card: #ffffff;
      --accent: #f76307;
      --accent-soft: #fffcab;
      --text-main: #1e1e1e;
      --text-muted: #666;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
    }

    body {
      margin: 10px;
      background: linear-gradient(to bottom, #ffffff, var(--bg-main));
      color: var(--text-main);
    }

    /* ---------- HEADER / HERO ---------- */
    header {
      padding: 60px 20px 40px;
      text-align: center;
      background: linear-gradient(135deg, #eef4ff, #ffffff);
    }

    header h1 {
      font-size: 3rem;
      margin: 0;
    }

    header p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 20px auto;
    }

    .cta-row {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-secondary {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

    /* ---------- SECTIONS ---------- */
    section {
      padding: 50px 20px;
      max-width: 1100px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    section p.section-desc {
      text-align: center;
      color: var(--text-muted);
      max-width: 700px;
      margin: auto auto 40px;
    }

    /* ---------- CARD GRID ---------- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    .card img {
      border-radius: var(--radius);
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: var(--text-muted);
    }
  </style>

  <!-- Verified CDN library script build for loading Excel workbooks -->
  <script src="https://jsdelivr.net"></script>
</head>

<body>

  <h1><u>Personalized Dashboard</u></h1>
  <h3>All you need from <span id="grade-display"></span><span id="section-display"></span> of <i><span id="school-name"></span></i></h3>

  <hr style="border: none; height: 5px; background-color: #333;">

  <h2>Syllabus</h2>
  <section>
    <div class="card-grid" id="syllabus-grid">
      <p id="loading-status">Loading textbooks from spreadsheet database...</p>
    </div>
  </section>

  <script>
    // 1. Ingest dashboard values safely from local browser storage
    const school = JSON.parse(localStorage.getItem("chosenSchool"));
    const grade = localStorage.getItem("chosenGrade") ? localStorage.getItem("chosenGrade").trim() : null;
    const section = localStorage.getItem("chosenSection");

    document.getElementById("school-name").textContent = school ? school.name : "Not selected";
    document.getElementById("grade-display").textContent = grade ? grade : "Not selected";
    document.getElementById("section-display").textContent = section ? " " + section : "";

    const gridContainer = document.getElementById("syllabus-grid");
    const statusText = document.getElementById("loading-status");

    /**
     * Maps standard grade string digits to corresponding lower-case letters.
     * Examples: '1' -> 'a', '9' -> 'i', '10' -> 'j'
     */
    function deriveGradeCharacter(gradeString) {
      const gradeInt = parseInt(gradeString, 10);
      if (isNaN(gradeInt) || gradeInt < 1 || gradeInt > 26) return "";
      return String.fromCharCode(96 + gradeInt); // 96 + 1 = 97 ('a')
    }

    // 2. Fetch and Render Spreadsheet Processing Engine
    async function loadSyllabusFromExcel() {
      if (!grade) {
        statusText.textContent = "Please select a grade to look up your syllabus configuration.";
        return;
      }

      // Check common deployment filename variants to prevent case sensitivity issues
      const filenameVariants = ["./BookDatabase.xlsx", "./BookDatabase.xslx", "BookDatabase.xlsx"];
      let response = null;

      for (const currentPath of filenameVariants) {
        try {
          const fetchCheck = await fetch(currentPath);
          if (fetchCheck.ok) {
            response = fetchCheck;
            break;
          }
        } catch (error) {
          console.warn(`Skipping path check: ${currentPath}`);
        }
      }

      if (!response) {
        statusText.innerHTML = `<span style="color: red; font-weight: 600;">Database Error: Could not locate BookDatabase.xlsx in your root folder. Verify that the file matches spelling configurations exactly.</span>`;
        return;
      }

      try {
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const parsedRows = XLSX.utils.sheet_to_json(worksheet);
        
        // Find records matching selected grade
        const matchingBooks = parsedRows.filter(row => {
          if (!row.Class) return false;
          return String(row.Class).trim() === grade;
        });

        gridContainer.innerHTML = "";

        if (matchingBooks.length === 0) {
          gridContainer.innerHTML = `<p>No textbooks listed in database matching Grade ${grade}.</p>`;
          return;
        }

        const gradeLetter = deriveGradeCharacter(grade);

        // 3. Render textbooks into structured interface cards
        matchingBooks.forEach(book => {
          const card = document.createElement("div");
          card.className = "card";

          const subject = book["Subject"] || "Unknown Subject";
          const chapters = book["Number of Chapters"] || "0";
          const code = String(book["Code"] || "").trim().toLowerCase();

          // EXACT FORMULATED ROUTING PATH PATTERNS:
          const coverUrl = `https://ncert.nic.in{gradeLetter}${code}cc.jpg`;
          const textBookUrl = `https://ncert.nic.in{gradeLetter}${code}=0-${chapters}`;

          card.innerHTML = `
            <h3>${subject}</h3>
            <p>NCERT Textbook for Class ${grade}</p>
            <p><small style="color: var(--accent); font-weight: 600;">Chapters: ${chapters} | Catalog Code: ${code}</small></p>
            
            <div style="text-align: center; margin: 15px 0; min-height: 150px; display: flex; align-items: center; justify-content: center;">
              <img src="${coverUrl}" alt="${subject} Cover Image" width="140" style="border-radius: var(--radius); box-shadow: var(--shadow);" 
                   onerror="this.onerror=null; this.parentNode.innerHTML='<div style=\'height:150px; width:140px; background:#fafafa; border:1px dashed #ccc; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#999; font-size:0.85rem; padding:10px; text-align:center;\'>Preview Cover Unavailable</div>';">
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
            
            <button class="btn btn-primary open-book-btn" style="width: 100%; font-weight: 600; margin-bottom: 10px;">
              📖 Read Online
            </button>
            
            <button class="btn btn-secondary search-btn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
              <span>Google Search</span>
              <img src="Google-Logo.jpg" alt="Google" width="50" style="border-radius: 4px; vertical-align: middle;">
            </button>
          `;

          // Event Listeners for links
          card.querySelector(".open-book-btn").onclick = () => {
            window.open(textBookUrl, "_blank");
          };

          card.querySelector(".search-btn").onclick = () => {
            const searchQuery = `NCERT ${subject} Class ${grade} Textbook PDF`;
            window.open(`https://google.com{encodeURIComponent(searchQuery)}`, "_blank");
          };

          gridContainer.appendChild(card);
        });

      } catch (err) {
        console.error("Spreadsheet ingestion failed:", err);
        statusText.innerHTML = `<span style="color: red; font-weight: 600;">Parsing Failure: ${err.message}</span>`;
      }
    }

    // Run execution sequence
    loadSyllabusFromExcel();
  </script>

  <hr style="border: none; height: 5px; background-color: #333;">

  <h2>Upload Leaderboard</h2>
  <p>The leading note uploaders from your grade.</p>

  <div class="topshape"></div>

</body>
</html>
