<!DOCTYPE HTML>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearNotes</title>

  <script src="https://jsdelivr.net"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" href="ClearNotesMiniLogo.png">

  <style>
    :root {
      --bg-main: #fcf2bd;
      --bg-card: #ffffff;
      --accent: #f76307;
      --accent-soft: #fffcab;
      --text-main: #1e1e1e;
      --text-muted: #666;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
    }

    body {
      margin: 10;
      background: linear-gradient(to bottom, #ffffff, var(--bg-main));
      color: var(--text-main);
    }

    /* ---------- HEADER / HERO ---------- */
    header {
      padding: 60px 20px 40px;
      text-align: center;
      background: linear-gradient(135deg, #eef4ff, #ffffff);
    }

    header h1 {
      font-size: 3rem;
      margin: 0;
    }

    header p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 20px auto;
    }

    .cta-row {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-secondary {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

    /* ---------- SECTIONS ---------- */
    section {
      padding: 50px 20px;
      max-width: 1100px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    section p.section-desc {
      text-align: center;
      color: var(--text-muted);
      max-width: 700px;
      margin: auto auto 40px;
    }

    /* ---------- CARD GRID ---------- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    .card img {
      border-radius: var(--radius);
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: var(--text-muted);
    }

    /* ---------- VIDEO ---------- */
    .video-wrapper {
      max-width: 720px;
      margin: auto;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    video {
      width: 100%;
      display: block;
    }

    /* ---------- QUOTES ---------- */
    .quote {
      background: linear-gradient(135deg, #f0f6ff, #ffffff);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
    }

    .quote i {
      color: var(--text-muted);
    }

    /* ---------- FOOTER ---------- */
    footer {
      text-align: center;
      padding: 40px 20px;
      background: #f0f2f6;
      color: var(--text-muted);
    }
  </style>
</head>

<BODY>

<h1><u>Personalized Dashboard</u></h1>
<h3>All you need from <span id="grade-display"></span><span id="section-display"></span> of <i><span id="school-name"></span></i></h3>

<hr style="border: none; height: 5px; background-color: #333;">

<h2>Syllabus</h2>
<section>
  <div class="card-grid" id="syllabus-grid">
    <p id="loading-status">Loading textbooks from database...</p>
  </div>
</section>

<script>
// 1. Fetch user data from localStorage
const school = JSON.parse(localStorage.getItem("chosenSchool"));
const grade = localStorage.getItem("chosenGrade") ? localStorage.getItem("chosenGrade").trim() : null;
const section = localStorage.getItem("chosenSection");

document.getElementById("school-name").textContent = school ? school.name : "Not selected";
document.getElementById("grade-display").textContent = grade ? grade : "Not selected";
document.getElementById("section-display").textContent = section ? " " + section : "";

const gridContainer = document.getElementById("syllabus-grid");
const statusText = document.getElementById("loading-status");

// 2. Dynamic Excel Fetch and Parse Function
async function loadSyllabusFromExcel() {
  if (!grade) {
    statusText.textContent = "Please select a grade to display your syllabus.";
    return;
  }

  try {
    // Fetch the Excel file relative to this HTML file
    const response = await fetch("./BookDatabase.xlsx");
    if (!response.ok) {
      throw new Error("Unable to read BookDatabase.xlsx. Ensure it's in the same directory and served via a local server.");
    }
    
    // Parse the file structure
    const arrayBuffer = await response.arrayBuffer();
    const data = new Uint8Array(arrayBuffer);
    const workbook = XLSX.read(data, { type: 'array' });
    
    // Extract the first sheet
    const firstSheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[firstSheetName];
    
    // Convert rows into a usable JSON object array
    const rawRows = XLSX.utils.sheet_to_json(worksheet);
    
    // Filter where row.Class matches our chosen grade value
    const matchingBooks = rawRows.filter(row => String(row.Class).trim() === grade);

    // Clear loading text
    gridContainer.innerHTML = "";

    if (matchingBooks.length === 0) {
      gridContainer.innerHTML = `<p>No textbooks found matching Grade ${grade}.</p>`;
      return;
    }

    // 3. Render the matched textbooks dynamically
    matchingBooks.forEach(book => {
      const card = document.createElement("div");
      card.className = "card";

      // Map spreadsheet column names safely
      const subject = book["Subject"] || "Unknown Subject";
      const chapters = book["Number of Chapters"] || "0";
      const code = book["Code"] || "N/A";

      card.innerHTML = `
        <h3>${subject}</h3>
        <p>NCERT Textbook for Class ${grade}</p>
        <p><small style="color: var(--accent); font-weight: 600;">Chapters: ${chapters} | Code: ${code}</small></p>
        <div style="height: 150px; background: #f8f9fa; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin: 15px 0; border: 1px dashed #ccc;">
          <span style="color: #999; font-size: 0.9rem;">[ Book Cover ]</span>
        </div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        <button class="btn btn-secondary search-btn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
          <span>Search textbook on</span>
          <img src="Google-Logo.jpg" alt="Google" width="60" style="border-radius: 4px; vertical-align: middle;">
        </button>
      `;

      // Set unique search query for this card
      card.querySelector(".search-btn").onclick = () => {
        const query = `NCERT ${subject} Textbook Class ${grade} PDF`;
        const url = "https://google.com" + encodeURIComponent(query);
        window.open(url, "_blank");
      };

      gridContainer.appendChild(card);
    });

  } catch (error) {
    console.error(error);
    statusText.innerHTML = `<span style="color: red;">Error reading spreadsheet: ${error.message}</span>`;
  }
}

// Fire data ingestion sequence
loadSyllabusFromExcel();
</script>

</BODY>
