<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearNotes</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Favicon -->
  <link rel="icon" href="ClearNotesMiniLogo.png">

  <style>
    :root {
      --bg-main: #fcf2bd;
      --bg-card: #ffffff;
      --accent: #f76307;
      --accent-soft: #fffcab;
      --text-main: #1e1e1e;
      --text-muted: #666;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
    }

    body {
      margin: 10px;
      background: linear-gradient(to bottom, #ffffff, var(--bg-main));
      color: var(--text-main);
    }

    /* ---------- SECTIONS ---------- */
    section {
      padding: 50px 20px;
      max-width: 1100px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    /* ---------- CARD GRID ---------- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: var(--text-muted);
    }

    .btn {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-secondary {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

.location-card {
    padding: 20px;
}

.location-layout {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 20px;
    align-items: stretch;
    margin-top: 18px;
}

.location-map-panel {
    min-width: 0;
}


#school-location-map {
    width: auto;
    aspect-ratio: 4 / 6;
    height: auto;
    border-radius: 12px;
    border: 2px solid white;
    box-shadow: var(--shadow);
    background: #eee;
    z-index: 1;
}

#school-location-status {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 12px;
    line-height: 1.5;
}

#location-school-name {
    color: var(--accent);
}

.school-location-marker {
    background: var(--accent);
    border: 3px solid white;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

.street-view-panel {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
}


.street-view-heading {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
}


#school-street-view {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 260px;
    flex: 1;
    border: none;
    border-radius: 12px;
    background: #eee;
    box-shadow: var(--shadow);
}


.street-view-note {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.82rem;
    line-height: 1.5;
}

@media (max-width: 650px) {

    .location-layout {
        grid-template-columns: minmax(0, 1fr);
    }
    .location-map-panel {
        width: min(100%, 260px);
    }
    #school-street-view {
        min-height: 260px;
    }

}
  </style>
</head>
<body>

  <h1><u>Personalized Dashboard</u></h1>
  <h3>All you need from <span id="grade-display"></span><span id="section-display"></span> of <i><span id="school-name"></span></i>.</h3>

  <hr style="border: none; height: 5px; background-color: #333;">

<h2>Your School</h2>
<div class="card location-card">
	
    <h3 id="location-school-name">
        Loading school...
    </h3>


    <p id="location-school-address">
        Loading school address...
    </p>

    <div class="location-layout">

        <div class="location-map-panel">

            <div
                id="school-location-map"
                aria-label="Map centred on the selected school">
            </div>


            <p
                id="school-location-status"
                aria-live="polite">
                Loading map...
            </p>

        </div>

        <div class="street-view-panel">
            <iframe
                id="school-street-view"
                title="Street View near the selected school"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen>
            </iframe>


            <p class="street-view-note">
                Street View provided by Google Maps.
            </p>

        </div>

    </div>

</div>

  <hr style="border: none; height: 5px; background-color: #333;">

  <h2>Syllabus</h2>
  <section>
    <div class="card-grid" id="syllabus-grid">
      <p id="loading-status">Loading textbooks...</p>
    </div>
  </section>

  <script>
    const school = JSON.parse(localStorage.getItem("chosenSchool"));
    const grade = localStorage.getItem("chosenGrade") ? localStorage.getItem("chosenGrade").trim() : null;
    const section = localStorage.getItem("chosenSection");

    document.getElementById("school-name").textContent = school ? school.name : "Not selected";
    document.getElementById("grade-display").textContent = grade ? grade : "Not selected";
    document.getElementById("section-display").textContent = section ? " " + section : "";

    const gridContainer = document.getElementById("syllabus-grid");
    const statusText = document.getElementById("loading-status");

    // Converts grade numbers ('9') to chronological lower-case alphabets ('i')
    function deriveGradeCharacter(gradeString) {
      const gradeInt = parseInt(gradeString, 10);
      if (isNaN(gradeInt) || gradeInt < 1 || gradeInt > 26) return "";
      return String.fromCharCode(96 + gradeInt); 
    }

    function injectExcelEngine(callback) {
      const script = document.createElement("script");

      script.src = "https://" + "cdn.jsdelivr.net/npm/" + "xlsx@0.18.5/dist/xlsx.full.min.js";
      script.onload = callback;
      script.onerror = () => {
        statusText.innerHTML = `<span style="color: red; font-weight: 600;">Failed to load Database parsing library. Please check your internet connection.</span>`;
      };
      document.head.appendChild(script);
    }

    async function loadSyllabusFromExcel() {
      if (!grade) {
        statusText.textContent = "Please select a grade to look up your syllabus.";
        return;
      }

      const paths = ["./BookDatabase.xlsx", "BookDatabase.xlsx", "./BookDatabase.xslx"];
      let response = null;

      for (const p of paths) {
        try {
          const res = await fetch(p);
          if (res.ok) {
            response = res;
            break;
          }
        } catch (e) {
          console.error("Path unavailable: " + p);
        }
      }

      if (!response) {
        statusText.innerHTML = `<span style="color: red; font-weight: 600;">Error: Could not locate database.</span>`;
        return;
      }

      try {
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        
        const workbook = window.XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const parsedRows = window.XLSX.utils.sheet_to_json(worksheet);
        
        const matchingBooks = parsedRows.filter(row => {
          if (!row.Class) return false;
          return String(row.Class).trim() === grade;
        });

        gridContainer.innerHTML = "";

        if (matchingBooks.length === 0) {
          gridContainer.innerHTML = `<p>No textbooks listed in database matching Grade ${grade}.</p>`;
          return;
        }

        const gradeLetter = deriveGradeCharacter(grade);

        matchingBooks.forEach(book => {
          const card = document.createElement("div");
          card.className = "card";

          const subject = book["Subject"] || "Unknown Subject";
          const chapters = book["Number of Chapters"] || "0";
          const code = String(book["Code"] || "").trim().toLowerCase();

          const coverUrl = `https://ncert.nic.in/textbook/pdf/${gradeLetter}${code}cc.jpg`;
          const textBookUrl = `https://ncert.nic.in/textbook.php?${gradeLetter}${code}=0-${chapters}`;

          card.innerHTML = `
            <h3>${subject}</h3>
            <p>NCERT Textbook for Class ${grade}</p>
            <p><small style="color: var(--accent); font-weight: 600;">Chapters: ${chapters} | Catalog Code: ${code}</small></p>
            
            <div style="text-align: center; margin: 15px 0; min-height: 150px; display: flex; align-items: center; justify-content: center;">
              <img src="${coverUrl}" alt="${subject} Cover" width="140" style="border-radius: var(--radius); box-shadow: var(--shadow);" 
                   onerror="this.onerror=null; this.parentNode.innerHTML='<div style=\'height:150px; width:140px; background:#fafafa; border:1px dashed #ccc; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#999; font-size:0.85rem; padding:10px; text-align:center;\'>Preview Cover Unavailable</div>';">
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
            
            <button class="btn btn-primary open-book-btn" style="margin-bottom: 10px;">
              Read Online
            </button>
            
            <button class="btn btn-secondary search-btn" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
              <span>Search on </span>
              <img src="Google-Logo.jpg" alt="Google" width="50" style="border-radius: 4px; vertical-align: middle;">
            </button>
          `;

          card.querySelector(".open-book-btn").onclick = () => {
            window.open(textBookUrl, "_blank");
          };

          card.querySelector(".search-btn").onclick = () => {
            const searchQuery = `NCERT ${subject} Class ${grade} Textbook PDF`;
            window.open(`https://google.com/search?q=${encodeURIComponent(searchQuery)}`);
          };

          gridContainer.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        statusText.innerHTML = `<span style="color: red; font-weight: 600;">Parsing Failure: ${err.message}</span>`;
      }
    }

    injectExcelEngine(loadSyllabusFromExcel);
  </script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    const locationSchoolName =
    document.getElementById("location-school-name");


const locationSchoolAddress =
    document.getElementById("location-school-address");


const locationMapStatus =
    document.getElementById("school-location-status");


const streetViewFrame =
    document.getElementById("school-street-view");

let selectedSchool = null;


try {

    selectedSchool = JSON.parse(
        localStorage.getItem("chosenSchool")
    );

} catch (error) {

    console.error(
        "Could not read the selected school:",
        error
    );

}

const schoolLocationMap = L.map(
    "school-location-map",
    {
        scrollWheelZoom: false
    }
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 12,

        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }
).addTo(schoolLocationMap);

const hasValidCoordinates =

    selectedSchool &&
    selectedSchool.lat !== undefined &&
    selectedSchool.lon !== undefined &&
    Number.isFinite(Number(selectedSchool.lat)) &&
    Number.isFinite(Number(selectedSchool.lon)) &&
    Number(selectedSchool.lat) >= -90 &&
    Number(selectedSchool.lat) <= 90 &&
    Number(selectedSchool.lon) >= -180 &&
    Number(selectedSchool.lon) <= 180;

if (hasValidCoordinates) {
    const schoolLatitude =
        Number(selectedSchool.lat);


    const schoolLongitude =
        Number(selectedSchool.lon);


    const schoolName =
        selectedSchool.name || "Unnamed School";

    locationSchoolName.textContent =
        schoolName;


    locationSchoolAddress.textContent =
        selectedSchool.address || "Address unavailable";

    schoolLocationMap.setView(
        [
            schoolLatitude,
            schoolLongitude
        ],
        16
    );

    const schoolMarker = L.circleMarker(
        [
            schoolLatitude,
            schoolLongitude
        ],
        {
            radius: 9,
            fillColor: "#f76307",
            color: "#ffffff",
            weight: 3,
            opacity: 1,
            fillOpacity: 1
        }
    ).addTo(schoolLocationMap);

    schoolMarker.bindPopup(
        `<strong>${escapeSchoolHTML(schoolName)}</strong>`
    );

    schoolMarker.bindTooltip(
        escapeSchoolHTML(schoolName),
        {
            permanent: true,
            direction: "top",
            offset: [0, -10]
        }
    );

    const streetViewURL = new URL(
        "https://maps.google.com/maps"
    );


    streetViewURL.searchParams.set(
        "layer",
        "c"
    );


    streetViewURL.searchParams.set(
        "cbll",
        `${schoolLatitude},${schoolLongitude}`
    );


    streetViewURL.searchParams.set(
        "cbp",
        "12,0,,0,0"
    );


    streetViewURL.searchParams.set(
        "output",
        "svembed"
    );


    streetViewFrame.src =
        streetViewURL.toString();

    locationMapStatus.textContent =
        `Coordinates: ${schoolLatitude.toFixed(5)}, ${schoolLongitude.toFixed(5)}`;


} else {

    locationSchoolName.textContent =
        "No school selected";


    locationSchoolAddress.textContent =
        "Select a school to display its location.";


    locationMapStatus.textContent =
        "School coordinates are unavailable.";

    schoolLocationMap.setView(
        [
            0,
            0
        ],
        7
    );


    // Do not display an unrelated Street View

    streetViewFrame.removeAttribute("src");


    streetViewFrame.title =
        "Street View unavailable because school coordinates are missing.";

}

function escapeSchoolHTML(value) {

    return String(value).replace(
        /[&<>"']/g,

        character => {

            const entities = {

                "&": "&amp;",

                "<": "&lt;",

                ">": "&gt;",

                '"': "&quot;",

                "'": "&#39;"

            };


            return entities[character];

        }
    );

}

setTimeout(
    () => {

        schoolLocationMap.invalidateSize();
},
    150
);

</script>

  <hr style="border: none; height: 5px; background-color: #333;">

  <h2>Upload Leaderboard</h2>
  <p>The leading note uploaders from your grade.</p>
  <div class="topshape"></div>

</body>
</html>
