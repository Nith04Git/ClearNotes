<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearNotes</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" href="ClearNotesMiniLogo.png">

  <style>
    :root {
      --bg-main: #fcf2bd;
      --bg-card: #ffffff;
      --accent: #f76307;
      --accent-soft: #fffcab;
      --text-main: #1e1e1e;
      --text-muted: #666;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(to bottom, #ffffff, var(--bg-main));
      color: var(--text-main);
    }

    /* ---------- HEADER / HERO ---------- */
    header {
      padding: 60px 20px 40px;
      text-align: center;
      background: linear-gradient(135deg, #eef4ff, #ffffff);
    }

    header h1 {
      font-size: 3rem;
      margin: 0;
    }

    header p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 20px auto;
    }

    .cta-row {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-secondary {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .chat-area {
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: var(--shadow);
      
      /* Position at bottom */
      position: fixed;
      bottom: 20px;
      left: 20px;
      
      /* Sizing - Use calc so it doesn't break on small screens */
      width: calc(100% - 40px); 
      max-width: 1200px; /* Limits size on big screens */
      
      padding: 15px 25px;
      border: 2px solid var(--accent-soft);
      border-radius: 15px;
      cursor: pointer;
      font-size: 1rem;
      text-align: left;
      z-index: 1000; /* Keeps it above everything else */
      transition: transform 0.2s ease;
    }

    .chat-area:hover {
      transform: scale(1.01);
      background: #fff;
    }

    /* Simple helper for the text inside */
    .chat-area span {
        font-weight: 600;
    }
     
    .chat-bubble {
      background: var(--accent);
      color: white;
      box-shadow: var(--shadow);
      padding: 10px 10px;
      text-align: left;
      width: fit-content;
      border-radius: 12px;
      position: relative; 
    }
    
.chat-bubble::after {
    content: "";
    position: absolute;
    
    /* Position it at the bottom-left */
    bottom: -8px; /* Pulls it 10px below the bubble */
    left: 10px;    /* Moves it slightly in from the left edge */
    
    /* Create the triangle using borders */
    border-width: 10px 15px 0 0; /* Adjust sizes here */
    border-style: solid;
    border-color: var(--accent) transparent transparent transparent;
    border-radius: 2px;
}


    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

    /* ---------- SECTIONS ---------- */
    section {
      padding: 50px 20px;
      max-width: 1100px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    section p.section-desc {
      text-align: center;
      color: var(--text-muted);
      max-width: 700px;
      margin: auto auto 40px;
    }

    /* ---------- CARD GRID ---------- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: var(--text-muted);
    }

    /* ---------- VIDEO ---------- */
    .video-wrapper {
      max-width: 720px;
      margin: auto;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    video {
      width: 100%;
      display: block;
    }

    /* ---------- QUOTES ---------- */
    .quote {
      background: linear-gradient(135deg, #f0f6ff, #ffffff);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
    }

    .quote i {
      color: var(--text-muted);
    }

    /* ---------- FOOTER ---------- */
    footer {
      text-align: center;
      padding: 40px 20px;
      background: #f0f2f6;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

<header>
  <h1>Class Chat</h1>
  <p>Welcome to your class chat!</p>

    <button class="btn chat-area">Converse or contribute...</button>
  <div class="chat-bubble">Hello</div>
</header>
