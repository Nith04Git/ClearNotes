<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearNotes</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Favicon -->
  <link rel="icon" href="ClearNotesMiniLogo.png">

  <style>
    :root {
      --bg-main: #fcf2bd;
      --bg-card: #ffffff;
      --accent: #f76307;
      --accent-soft: #fffcab;
      --text-main: #1e1e1e;
      --text-muted: #666;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
    }

    body {
      margin: 10px;
      background: linear-gradient(to bottom, #ffffff, var(--bg-main));
      color: var(--text-main);
    }

    /* ---------- SECTIONS ---------- */
    section {
      padding: 50px 20px;
      max-width: 1100px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    /* ---------- CARD GRID ---------- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: var(--text-muted);
    }

    .btn {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-secondary {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

.location-card {
    padding: 20px;
}

.location-layout {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 20px;
    align-items: stretch;
    margin-top: 18px;
}

.location-map-panel {
    min-width: 0;
}


#school-location-map {
    width: auto;
    aspect-ratio: 3 / 6;
    height: auto;
    border-radius: 12px;
    border: 2px solid white;
    box-shadow: var(--shadow);
    background: #eee;
    z-index: 1;
}

#school-location-status {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 12px;
    line-height: 1.5;
}

#location-school-name {
    color: var(--accent);
}

.school-location-marker {
    background: var(--accent);
    border: 3px solid white;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

.street-view-panel {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
}


.street-view-heading {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
}


#school-street-view {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 260px;
    flex: 1;
    border: none;
    border-radius: 12px;
    background: #eee;
    box-shadow: var(--shadow);
}


.street-view-note {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.82rem;
    line-height: 1.5;
}

@media (max-width: 650px) {

    .location-layout {
        grid-template-columns: minmax(0, 1fr);
    }
    .location-map-panel {
        width: min(100%, 300px);
    }
    #school-street-view {
        min-height: 300px;
    }

}

  </style>
</head>

<body>
<h1><u>School Info</u></h1>

<div class="card location-card">
    <h3 id="location-school-name">
        Loading school...
    </h3>

    <p id="location-school-address">
        Loading school address...
    </p>

    <div class="location-layout">
        <div class="location-map-panel">
            <div
                id="school-location-map"
                aria-label="Map centred on the selected school">
            </div>
            <p
                id="school-location-status"
                aria-live="polite">
                Loading map...
            </p>
        </div>

        <div class="street-view-panel">
            <iframe
                id="school-street-view"
                title="Street View near the selected school"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen>
            </iframe>
            <p class="street-view-note">
                Street View provided by Google Maps.
            </p>
        </div>
    </div>
</div>

<br><br>

<div class="card" id="school-online-profile" style="display:none;">
<br><br>
    <h3>School Website</h3>

    <p id="school-website-status">
        Looking up website...
    </p>

    <a
        id="school-website-link"
        target="_blank"
        style="display:none;">
        Visit Website →
    </a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    const locationSchoolName =
    document.getElementById("location-school-name");


const locationSchoolAddress =
    document.getElementById("location-school-address");


const locationMapStatus =
    document.getElementById("school-location-status");


const streetViewFrame =
    document.getElementById("school-street-view");

let selectedSchool = null;


try {

    selectedSchool = JSON.parse(
        localStorage.getItem("chosenSchool")
    );

} catch (error) {

    console.error(
        "Could not read the selected school:",
        error
    );

}

const schoolLocationMap = L.map(
    "school-location-map",
    {
        scrollWheelZoom: false
    }
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 12,

        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }
).addTo(schoolLocationMap);

const hasValidCoordinates =

    selectedSchool &&
    selectedSchool.lat !== undefined &&
    selectedSchool.lon !== undefined &&
    Number.isFinite(Number(selectedSchool.lat)) &&
    Number.isFinite(Number(selectedSchool.lon)) &&
    Number(selectedSchool.lat) >= -90 &&
    Number(selectedSchool.lat) <= 90 &&
    Number(selectedSchool.lon) >= -180 &&
    Number(selectedSchool.lon) <= 180;

if (hasValidCoordinates) {
    const schoolLatitude =
        Number(selectedSchool.lat);


    const schoolLongitude =
        Number(selectedSchool.lon);


    const schoolName =
        selectedSchool.name || "Unnamed School";

    locationSchoolName.textContent =
        schoolName;


    locationSchoolAddress.textContent =
        selectedSchool.address || "Address unavailable";

findSchoolData(
    schoolLatitude,
    schoolLongitude,
    schoolName
);

findNearbyRoads(
    schoolLatitude,
    schoolLongitude
);

    schoolLocationMap.setView(
        [
            schoolLatitude,
            schoolLongitude
        ],
        16
    );

    const schoolMarker = L.circleMarker(
        [
            schoolLatitude,
            schoolLongitude
        ],
        {
            radius: 9,
            fillColor: "#f76307",
            color: "#ffffff",
            weight: 3,
            opacity: 1,
            fillOpacity: 1
        }
    ).addTo(schoolLocationMap);

    schoolMarker.bindPopup(
        `<strong>${escapeSchoolHTML(schoolName)}</strong>`
    );

    schoolMarker.bindTooltip(
        escapeSchoolHTML(schoolName),
        {
            permanent: true,
            direction: "top",
            offset: [0, -10]
        }
    );

    const streetViewURL = new URL(
        "https://maps.google.com/maps"
    );


    streetViewURL.searchParams.set(
        "layer",
        "c"
    );


    streetViewURL.searchParams.set(
        "cbll",
        `${schoolLatitude},${schoolLongitude}`
    );


    streetViewURL.searchParams.set(
        "cbp",
        "12,0,,0,0"
    );


    streetViewURL.searchParams.set(
        "output",
        "svembed"
    );


    streetViewFrame.src =
        streetViewURL.toString();

    locationMapStatus.textContent =
        `Coordinates: ${schoolLatitude.toFixed(5)}, ${schoolLongitude.toFixed(5)}`;


} else {

    locationSchoolName.textContent =
        "No school selected";


    locationSchoolAddress.textContent =
        "Select a school to display its location.";


    locationMapStatus.textContent =
        "School coordinates are unavailable.";

    schoolLocationMap.setView(
        [
            0,
            0
        ],
        7
    );


    // Do not display an unrelated Street View

    streetViewFrame.removeAttribute("src");


    streetViewFrame.title =
        "Street View unavailable because school coordinates are missing.";

}

function escapeSchoolHTML(value) {

    return String(value).replace(
        /[&<>"']/g,

        character => {

            const entities = {

                "&": "&amp;",

                "<": "&lt;",

                ">": "&gt;",

                '"': "&quot;",

                "'": "&#39;"

            };


            return entities[character];

        }
    );

}

setTimeout(
    () => {

        schoolLocationMap.invalidateSize();
},
    150
);

async function findSchoolData(latitude,longitude,schoolName) {

    try {
       const radius = 150;
        const query = `
[out:json];
(
  node(around:${radius},${latitude},${longitude})["amenity"="school"];
  way(around:${radius},${latitude},${longitude})["amenity"="school"];
  relation(around:${radius},${latitude},${longitude})["amenity"="school"];
);
out tags;
`;

        const response =
            await fetch(
                "https://overpass-api.de/api/interpreter",
                {
                    method: "POST",
                    body: query
                }
            );

if (!response.ok) {

    throw new Error(
        `Overpass returned ${response.status}`
    );

}

const data =
    await response.json();

        if (
            !data.elements ||
            data.elements.length === 0
        ) {
            return;
        }

const element =
    data.elements.find(
        item =>
            item.tags &&
            item.tags.website &&
            item.tags.name &&
            item.tags.name
                .toLowerCase()
                .includes(
                    schoolName.toLowerCase()
                )
    );

        if (
            !element
        ) {
            return;
        }

        const website =
            element.tags.website;

        document.getElementById(
            "school-online-profile"
        ).style.display =
            "block";

        document.getElementById(
            "school-website-status"
        ).textContent =
            "Website discovered from OpenStreetMap.";

        const link =
            document.getElementById(
                "school-website-link"
            );

        link.href =
            website;

        link.style.display =
            "inline-block";



    }

    catch (error) {

        console.error(
            "Website lookup failed:",
            error
        );

    }

}

async function findNearbyRoads(
    latitude,
    longitude
) {

    try {

        const radius = 250;

        const query = `
[out:json];
(
  way(around:${radius},${latitude},${longitude})["highway"];
);
out tags;
`;

        const response = await fetch(
            "https://overpass-api.de/api/interpreter",
            {
                method: "POST",
                body: query
            }
        );

        if (!response.ok) {
            throw new Error(
                `Overpass returned ${response.status}`
            );
        }

        const data =
            await response.json();

        if (
            !data.elements ||
            data.elements.length === 0
        ) {
            return;
        }

        const roadCard =
            document.getElementById(
                "road-quality-card"
            );

        const roadStatus =
            document.getElementById(
                "road-quality-status"
            );

        let messages = [];

        data.elements.forEach(
            road => {

                const tags =
                    road.tags || {};

                const surface =
                    tags.surface;

                const smoothness =
                    tags.smoothness;

                if (
                    surface === "gravel"
                ) {

                    messages.push(
                        "Some nearby roads are gravel."
                    );

                }

                if (
                    surface === "unpaved"
                ) {

                    messages.push(
                        "Some nearby roads are unpaved and may become muddy after rain."
                    );

                }

                if (
                    surface === "sand"
                ) {

                    messages.push(
                        "Sandy road surfaces exist nearby."
                    );

                }

                if (
                    surface === "dirt"
                ) {

                    messages.push(
                        "Dirt roads exist nearby and may be affected by weather."
                    );

                }

                if (
                    smoothness === "bad"
                ) {

                    messages.push(
                        "Some nearby roads are marked as being in poor condition."
                    );

                }

            }
        );

        if (
            messages.length === 0
        ) {

            messages.push(
                "No significant road-surface concerns were identified nearby."
            );

        }

        roadStatus.innerHTML =
            messages
                .filter(
                    (value, index, array) =>
                        array.indexOf(value) === index
                )
                .join("<br>");

        roadCard.style.display =
            "block";

    }

    catch (error) {

        console.error(
            "Road quality lookup failed:",
            error
        );

    }

}
</script>
<br><br>

<h2>Environmental Factors</h2>
<section>
<div class="card-grid">
<div id="academic-climate-section" style="display:none; text-align:left;" class="card">
<h3>Climate</h3>

    <img
        id="academic-climate-icon"
        style="
            width:40px;
            height:40px;
            float:right;
            display:none;
            margin-left:12px;
        ">

    <h3 id="academic-climate-title"></h3>

    <p id="academic-climate-message"></p>

</div>

<div class="card" id="road-quality-card" style="display:none;">
<div class="card">
    <h3>Road Quality</h3>

    <p id="road-quality-status">
        Checking nearby roads...
    </p>
</div>
</div>

</div>
</div>

</section>


<script defer src="academic_climate_conditions.js"></script>

</body>
</html>
