<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>ClearNotes Study Desk</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">

<style>

:root{
    --accent:#f76307;
    --accent-soft:#fff1a8;
    --sidebar:#ffffff;
    --workspace:#fff8d8;
    --title:#1f1f1f;
    --shadow:0 12px 30px rgba(0,0,0,.15);
}

*{
    box-sizing:border-box;
    font-family:"Bricolage Grotesque",sans-serif;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff8d8;
}

#dock{

    position:fixed;

    bottom:0;
    left:0;
    right:0;

    height:70px;

    background:white;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    padding:10px;

    border-top:1px solid #ddd;

    box-shadow:
        0 -5px 20px rgba(0,0,0,.08);

    z-index:1000;
}

.app{
    background:#fafafa;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.2s;
}

.app:hover{
    background:#fff1a8;
}

#workspace{

    width:100%;
    height:calc(100vh - 70px);

    position:relative;

    overflow:hidden;

}

/* WINDOWS */

.window{
    position:absolute;

    width:700px;
    height:440px;

    background:white;

    border-radius:14px;

    box-shadow:var(--shadow);

    overflow:hidden;

    resize:both;

    z-index:10;
}

#dispose-zone{

    position:fixed;

    bottom:10px;
    right:20px;

    width:200px;

    height:50px;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#ffeded;

    color:#d40000;

    border:2px dashed #ff7070;

    transition:.2s;

    z-index:1500;

}

#dispose-zone.active{

    background:#ff7070;

    color:white;

    transform:scale(1.05);

}

.titlebar{
    height:48px;

    background:#222;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 14px;

    cursor:grab;

    user-select:none;
}

.window iframe{
    width:100%;
    height:calc(100% - 48px);
    border:none;
}

.close-btn{
    border:none;
    background:none;
    color:white;
    font-size:20px;
    cursor:pointer;
}

#hint{
    position:absolute;
    right:24px;
    bottom:24px;

    background:white;

    padding:16px;

    border-radius:12px;

    box-shadow:var(--shadow);

    color:#666;
}

</style>
</head>

<body>

<div id="dock" style="position: absolute;">

<h2 style="position: absolute; left: 1%;">Study Desk</h2>

<div
class="app"
data-title="Dashboard"
data-src="dashboard.html">

Dashboard

</div>

<div
class="app"
data-title="Courses"
data-src="coursegallery.html">

Courses

</div>

<div
class="app"
data-title="Class Chat"
data-src="groupchat.html">

Class Chat

</div>

<div
class="app"
data-title="School Info"
data-src="schoolinfo.html">

School Info

</div>

<div
class="app"
data-title="Notes Gallery"
data-src="notesgallery.html">

Notes Gallery

</div>

<div
class="app"
data-title="Detox"
data-src="detox.html">

Detox

</div>

<div
class="app"
data-title="Study Buddy"
data-src="https://justusi-study-companion-2.hf.space">

Study Buddy

</div>

<div
class="app"
data-title="Notes"
data-src="pickSubject.html">

Notes

</div>

</div>

<div id="workspace">

<div id="hint">
Drag windows to the dock to close them.
</div>

</div>

<div id="dispose-zone">

    🗑 Drop Here To Close

</div>

<script>

const workspace =
    document.getElementById("workspace");

const disposeZone =
    document.getElementById("dispose-zone");

let highestZ = 100;

/* -----------------------------
   Save Workspace
----------------------------- */

function saveWorkspace() {

    const windows =

        [...document.querySelectorAll(".window")]

        .map(win => ({
            title: win.dataset.title,
            src: win.dataset.src,
            left: win.style.left,
            top: win.style.top,
            width: win.style.width,
            height: win.style.height
        }));

    localStorage.setItem(
        "studydesk_layout",
        JSON.stringify(windows)
    );

}

/* -----------------------------
   Create Window
----------------------------- */

function createWindow(
    title,
    src,
    restoreData = null
) {

    const win =
        document.createElement("div");

    win.className =
        "window";

    win.dataset.title =
        title;

    win.dataset.src =
        src;

    win.style.left =
        restoreData?.left || "40px";

    win.style.top =
        restoreData?.top || "40px";

    win.style.width =
        restoreData?.width || "700px";

    win.style.height =
        restoreData?.height || "440px";

    win.innerHTML = `
        <div class="titlebar">

            <span>${title}</span>

            <button class="close-btn">
                ×
            </button>

        </div>

        <iframe src="${src}"></iframe>
    `;

    workspace.appendChild(win);

    win.style.zIndex =
        ++highestZ;

    win.querySelector(".close-btn")
        .addEventListener(
            "click",
            () => {

                win.remove();

                saveWorkspace();

            }
        );

    makeDraggable(win);

    saveWorkspace();

}

/* -----------------------------
   Open Apps
----------------------------- */

document
.querySelectorAll(".app")
.forEach(app => {

    app.addEventListener(
        "click",

        () => {

            createWindow(
                app.dataset.title,
                app.dataset.src
            );

        }

    );

});

/* -----------------------------
   Dispose Zone
----------------------------- */

function updateDisposeState(
    clientX,
    clientY
) {

    if (!disposeZone)
        return false;

    const rect =
        disposeZone.getBoundingClientRect();

    const inside =

        clientX >= rect.left &&
        clientX <= rect.right &&
        clientY >= rect.top &&
        clientY <= rect.bottom;

    disposeZone.classList.toggle(
        "active",
        inside
    );

    return inside;

}

/* -----------------------------
   Dragging
----------------------------- */

function makeDraggable(win) {

    const titlebar =
        win.querySelector(".titlebar");

    let dragging = false;

    let offsetX = 0;
    let offsetY = 0;

    titlebar.addEventListener(

        "mousedown",

        e => {

            dragging =
                true;

            win.style.zIndex =
                ++highestZ;

            offsetX =
                e.clientX -
                win.offsetLeft;

            offsetY =
                e.clientY -
                win.offsetTop;

        }

    );

    document.addEventListener(

        "mousemove",

        e => {

            if (!dragging)
                return;

            win.style.left =
                (
                    e.clientX -
                    offsetX
                ) + "px";

            win.style.top =
                (
                    e.clientY -
                    offsetY
                ) + "px";

            updateDisposeState(
                e.clientX,
                e.clientY
            );

        }

    );

    document.addEventListener(

        "mouseup",

        e => {

            if (!dragging)
                return;

            dragging = false;

            const shouldDispose =
                updateDisposeState(
                    e.clientX,
                    e.clientY
                );

            disposeZone?.classList.remove(
                "active"
            );

            if (shouldDispose) {

                win.remove();

                saveWorkspace();

                return;
            }

            saveWorkspace();

        }

    );

}

/* -----------------------------
   Restore Workspace
----------------------------- */

const savedLayout =

    JSON.parse(

        localStorage.getItem(
            "studydesk_layout"
        ) || "[]"

    );

savedLayout.forEach(

    item => {

        createWindow(
            item.title,
            item.src,
            item
        );

    }

);

</script>
</body>
</html>
